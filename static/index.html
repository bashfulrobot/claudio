<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Claudio</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --card: #1c1c1e;
    --card-elevated: #2c2c2e;
    --text: #f2f2f7;
    --muted: #98989f;
    --accent: #0a84ff;
    --danger: #ff453a;
    --border: #38383a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
  }
  header {
    padding: 20px 16px 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  h1 { font-size: 28px; margin: 0; }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 2px; }
  main { padding: 8px 16px 40px; max-width: 640px; margin: 0 auto; }
  section { margin-top: 24px; }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px 4px;
  }
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .session-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
  }
  .session-info { min-width: 0; flex: 1; }
  .session-name { font-weight: 600; font-size: 17px; }
  .session-cwd {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.busy, .badge.working { background: #4a3b00; color: #ffd54a; }
  .badge.idle, .badge.done { background: #0e3d1d; color: #5fe38a; }
  .badge.worktree { background: var(--card-elevated); color: var(--muted); }
  .session-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .session-toggle {
    min-width: 0;
    flex: 1;
    display: block;
    text-align: left;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font: inherit;
  }
  .kill-btn {
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .kill-btn:active { opacity: 0.7; }
  .expand-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .stop-btn {
    background: var(--card-elevated);
    color: #ffd54a;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 600;
  }
  .stop-btn:active { opacity: 0.7; }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 24px 0;
    font-size: 15px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    border: 1px solid var(--border);
  }
  .favorites-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
    color: var(--text);
  }
  .chip.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .chip-root { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .chip.selected .chip-root { color: rgba(255, 255, 255, 0.8); }
  .picker { position: relative; }
  .fuzzy-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  }
  .fuzzy-dropdown.show { display: block; }
  .fuzzy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
  }
  .fuzzy-row:not(:last-child) { border-bottom: 1px solid var(--border); }
  .fuzzy-row.highlighted { background: var(--bg); }
  .fuzzy-name { font-size: 15px; }
  .fuzzy-root { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .fuzzy-star {
    background: none;
    border: none;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
    padding: 4px;
  }
  .fuzzy-star.active { color: #ffb300; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type=text], select, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    /* 16px is load-bearing: anything smaller triggers Safari's
       focus-triggered auto-zoom on iOS, which is miserable one-handed. */
    font-size: 16px;
    font-family: inherit;
  }
  select {
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2398989f'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 34px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .options {
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 4px;
  }
  .options summary {
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }
  .options summary::-webkit-details-marker { display: none; }
  .options summary::after { content: '▸'; font-size: 12px; }
  .options[open] summary::after { content: '▾'; }
  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0 6px;
    color: var(--text);
    font-size: 15px;
  }
  .check-row input[type=checkbox] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .spawn-btn {
    width: 100%;
    margin-top: 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 17px;
    font-weight: 600;
  }
  .spawn-btn:disabled { opacity: 0.5; }
  .spawn-btn:active { opacity: 0.7; }
  .toast {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 16px);
    left: 16px;
    right: 16px;
    background: var(--text);
    color: var(--bg);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<header>
  <h1>Claudio</h1>
  <div class="subtitle">Claude Code sessions on this machine</div>
</header>
<main>
  <section>
    <h2>Running</h2>
    <div id="sessions" class="card-list">
      <div class="empty">Loading…</div>
    </div>
  </section>

  <section>
    <h2>New session</h2>
    <div class="card">
      <div id="favorites-row" class="favorites-row"></div>
      <label for="cwd">Folder</label>
      <div class="picker">
        <input id="cwd" type="text" placeholder="/home/you/git/some-project" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
        <div id="fuzzy-dropdown" class="fuzzy-dropdown"></div>
      </div>
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="session name" autocapitalize="off" autocorrect="off" spellcheck="false">

      <details id="spawn-options" class="options">
        <summary><span id="options-label">Options</span></summary>

        <label class="check-row">
          <input id="worktree" type="checkbox" checked>
          <span>Isolate in a git worktree</span>
        </label>

        <label for="model">Model</label>
        <select id="model">
          <option value="">Default</option>
          <option value="sonnet">Sonnet</option>
          <option value="opus">Opus</option>
          <option value="fable">Fable</option>
          <option value="haiku">Haiku</option>
        </select>

        <label for="effort">Effort</label>
        <select id="effort">
          <option value="">Default</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="xhigh">XHigh</option>
          <option value="max">Max</option>
        </select>

        <label for="permission-mode">Permission mode</label>
        <select id="permission-mode">
          <option value="">Default</option>
          <option value="acceptEdits">Accept edits</option>
          <option value="auto">Auto</option>
          <option value="dontAsk">Don't ask</option>
          <option value="manual">Manual</option>
          <option value="plan">Plan</option>
          <option value="bypassPermissions">Bypass permissions</option>
        </select>

        <label for="prompt">Initial prompt</label>
        <textarea id="prompt" rows="3" placeholder="optional — sent as the first message" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      </details>

      <button id="spawn-btn" class="spawn-btn">Spawn Session</button>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
const sessionsEl = document.getElementById('sessions');
const favoritesRowEl = document.getElementById('favorites-row');
const fuzzyDropdownEl = document.getElementById('fuzzy-dropdown');
const cwdInput = document.getElementById('cwd');
const nameInput = document.getElementById('name');
const spawnBtn = document.getElementById('spawn-btn');
const toastEl = document.getElementById('toast');
const optionsEl = document.getElementById('spawn-options');
const optionsLabelEl = document.getElementById('options-label');
const worktreeInput = document.getElementById('worktree');
const modelInput = document.getElementById('model');
const effortInput = document.getElementById('effort');
const permissionModeInput = document.getElementById('permission-mode');
const promptInput = document.getElementById('prompt');

const FAVORITES_KEY = 'claudio.favorites';
let allEntries = [];       // flattened {root, dir, path} across all configured roots
let favorites = new Set(); // full paths the user has starred, populated at init (see bottom of script)
let currentResults = [];   // entries currently rendered in the fuzzy dropdown
let highlightedIndex = -1; // keyboard-selected row within currentResults, -1 = none
let lastSessions = [];     // most recently fetched session list, so a card's expand/collapse toggle can re-render without a round trip
let expandedIds = new Set(); // session ids with their action row expanded — survives re-render, and pauses the 4s poll (see refreshSessions)

// Spawn options are deliberately NOT persisted (no localStorage): an option
// that's both sticky and hidden behind a closed <details> is invisible
// surprise. "Why is everything running on bypassPermissions?" is a bug
// report filed once and then chased for an hour. Every spawn starts from
// the documented defaults, and resetSpawnOptions() restores them after
// each successful spawn.
function updateOptionsLabel() {
  let n = 0;
  if (!worktreeInput.checked) n++; // unchecked is the deviation — worktree defaults ON
  if (modelInput.value) n++;
  if (effortInput.value) n++;
  if (permissionModeInput.value) n++;
  if (promptInput.value.trim()) n++;
  optionsLabelEl.textContent = n > 0 ? `Options · ${n}` : 'Options';
}

function resetSpawnOptions() {
  worktreeInput.checked = true;
  modelInput.value = '';
  effortInput.value = '';
  permissionModeInput.value = '';
  promptInput.value = '';
  optionsEl.open = false;
  updateOptionsLabel();
}

[worktreeInput, modelInput, effortInput, permissionModeInput].forEach(field => {
  field.addEventListener('change', updateOptionsLabel);
});
promptInput.addEventListener('input', updateOptionsLabel);

// The page may be served at "/" directly or behind a reverse-proxy path
// prefix (e.g. tailscale serve --set-path=/claudio strips the prefix before
// forwarding to this app, so the browser must keep it on every fetch).
// Derived from the page's own URL so no server-side config is needed.
const API_BASE = location.pathname.replace(/\/$/, '');

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function basename(p) {
  const parts = p.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : p;
}

function loadFavorites() {
  try {
    const raw = localStorage.getItem(FAVORITES_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return new Set(Array.isArray(arr) ? arr.filter(x => typeof x === 'string') : []);
  } catch (e) {
    return new Set();
  }
}

function saveFavorites() {
  try {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
  } catch (e) {
    // persistence is best-effort (quota exceeded, private browsing, etc.);
    // the in-memory Set still reflects the toggle, so keep going
  }
}

function toggleFavorite(path) {
  if (favorites.has(path)) {
    favorites.delete(path);
  } else {
    favorites.add(path);
  }
  saveFavorites();
  renderFavoritesRow();
}

function flattenGroups(groups) {
  const entries = [];
  for (const g of (groups || [])) {
    if (!g.dirs || !g.dirs.length) continue;
    const root = g.root.replace(/\/$/, '');
    for (const d of g.dirs) {
      entries.push({ root, dir: d, path: root + '/' + d });
    }
  }
  return entries;
}

// Classic fzf-style subsequence match: every character of `query` must
// appear in `target`, in order, but not necessarily contiguous. Returns a
// score (higher = better match) or null if `target` doesn't match at all.
// Contiguous runs and matches near the start of the string score higher.
function fuzzyScore(query, target) {
  const q = query.toLowerCase();
  const t = target.toLowerCase();
  if (!q) return 0;
  let qi = 0;
  let score = 0;
  let streak = 0;
  for (let ti = 0; ti < t.length && qi < q.length; ti++) {
    if (t[ti] === q[qi]) {
      streak += 1;
      score += 1 + streak;
      if (ti === 0) score += 3;
      qi += 1;
    } else {
      streak = 0;
    }
  }
  if (qi < q.length) return null; // not every query character matched
  score -= t.length * 0.01;       // mild preference for shorter names
  return score;
}

function renderFavoritesRow() {
  favoritesRowEl.textContent = '';
  const favEntries = allEntries.filter(e => favorites.has(e.path));
  // Same dir name can exist under more than one root (e.g. ~/git/foo and
  // ~/dev/foo) — count occurrences so we only add a root label when it's
  // actually needed to tell two favorited chips apart.
  const dirCounts = {};
  for (const entry of favEntries) {
    dirCounts[entry.dir] = (dirCounts[entry.dir] || 0) + 1;
  }
  for (const entry of favEntries) {
    const chip = el('button', 'chip', entry.dir);
    chip.type = 'button';
    if (dirCounts[entry.dir] > 1) {
      chip.appendChild(el('span', 'chip-root', entry.root));
    }
    chip.addEventListener('click', () => selectEntry(entry, chip));
    favoritesRowEl.appendChild(chip);
  }
}

function selectEntry(entry, chipEl) {
  favoritesRowEl.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
  if (chipEl) chipEl.classList.add('selected');
  cwdInput.value = entry.path;
  if (!nameInput.value) nameInput.value = basename(entry.dir);
  closeDropdown();
}

function computeResults(query) {
  if (!query) {
    const favs = allEntries.filter(e => favorites.has(e.path));
    const rest = allEntries
      .filter(e => !favorites.has(e.path))
      .slice()
      .sort((a, b) => a.dir.localeCompare(b.dir));
    return favs.concat(rest).slice(0, 10);
  }
  const scored = [];
  for (const entry of allEntries) {
    const score = fuzzyScore(query, entry.dir);
    if (score !== null) scored.push({ entry, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 10).map(s => s.entry);
}

function renderDropdown(query) {
  currentResults = computeResults(query);
  highlightedIndex = -1;
  fuzzyDropdownEl.textContent = '';
  for (const entry of currentResults) {
    const row = el('div', 'fuzzy-row');

    const name = el('span', 'fuzzy-name', entry.dir);
    name.appendChild(el('span', 'fuzzy-root', entry.root));

    const isFav = favorites.has(entry.path);
    const star = el('button', 'fuzzy-star' + (isFav ? ' active' : ''), isFav ? '★' : '☆');
    star.type = 'button';
    const activateStar = (e) => {
      // preventDefault on mousedown cancels the browser's default
      // "move focus to target" action for THIS interaction, so #cwd never
      // blurs in the first place when a star/row is tapped directly — no
      // race with the blur handler below for this path. touchstart needs
      // its own preventDefault: on iOS Safari a touchstart can blur the
      // focused input before the synthesized mousedown fires, so relying
      // on mousedown alone silently drops taps on that browser.
      e.preventDefault();
      toggleFavorite(entry.path);
      renderDropdown(cwdInput.value.trim());
    };
    star.addEventListener('mousedown', activateStar);
    star.addEventListener('touchstart', activateStar);

    const activateRow = (e) => {
      if (e.target === star) return;
      e.preventDefault();
      selectEntry(entry, null);
    };
    row.addEventListener('mousedown', activateRow);
    row.addEventListener('touchstart', activateRow);

    row.appendChild(name);
    row.appendChild(star);
    fuzzyDropdownEl.appendChild(row);
  }
  fuzzyDropdownEl.classList.toggle('show', currentResults.length > 0);
}

function openDropdown() {
  renderDropdown(cwdInput.value.trim());
}

function closeDropdown() {
  fuzzyDropdownEl.classList.remove('show');
  fuzzyDropdownEl.textContent = '';
  currentResults = [];
  highlightedIndex = -1;
}

function updateHighlight() {
  const rows = fuzzyDropdownEl.querySelectorAll('.fuzzy-row');
  rows.forEach((r, i) => r.classList.toggle('highlighted', i === highlightedIndex));
}

cwdInput.addEventListener('keydown', (e) => {
  if (!fuzzyDropdownEl.classList.contains('show')) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, currentResults.length - 1);
    updateHighlight();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, 0);
    updateHighlight();
  } else if (e.key === 'Enter') {
    if (highlightedIndex >= 0 && currentResults[highlightedIndex]) {
      e.preventDefault();
      selectEntry(currentResults[highlightedIndex], null);
    }
  } else if (e.key === 'Escape') {
    closeDropdown();
  }
});

async function refreshSessions() {
  // A card mid-expansion must survive the poll -- rebuilding the list here
  // would instantly re-collapse it, which reads as broken. The toggle click
  // handler re-renders from lastSessions directly, bypassing this guard.
  if (expandedIds.size > 0) return;
  try {
    const res = await fetch(`${API_BASE}/api/sessions`);
    if (!res.ok) throw new Error('failed to load sessions');
    const sessions = await res.json();
    lastSessions = sessions || [];
    renderSessions(lastSessions);
  } catch (e) {
    sessionsEl.textContent = '';
    sessionsEl.appendChild(el('div', 'empty', "Couldn't reach claudio: " + e.message));
  }
}

// Builds each session card via DOM APIs (textContent, not innerHTML) so
// nothing from `claude agents --json` (names, paths) can be interpreted as
// markup, even though these values only ever come from the local machine.
//
// Tapping the card body (not Kill) expands an inline row holding Stop. That
// beats a swipe or long-press gesture on a list that re-renders on a timer:
// the whole ~64pt card is the target instead of a small top-right glyph, it
// teaches itself on the first accidental tap, and it never fights vertical
// scroll the way a swipe would.
function renderSessions(sessions) {
  sessionsEl.textContent = '';
  if (!sessions.length) {
    sessionsEl.appendChild(el('div', 'empty', 'No sessions running'));
    return;
  }
  for (const s of sessions) {
    const state = (s.state || s.status || '').toLowerCase();
    const displayName = s.name || s.id || 'unnamed';

    const card = el('div', 'session-card');
    const row = el('div', 'session-row');

    const toggle = el('button', 'session-toggle');
    toggle.type = 'button';
    const info = el('div', 'session-info');
    info.appendChild(el('div', 'session-name', displayName));
    info.appendChild(el('div', 'session-cwd', s.repo || s.cwd || ''));

    const meta = el('div', 'session-meta');
    meta.appendChild(el('span', 'badge ' + state, s.status || s.state || 'unknown'));
    if (s.worktree) meta.appendChild(el('span', 'badge worktree', '⑂ ' + s.worktree));
    meta.appendChild(el('span', null, s.id || ''));
    info.appendChild(meta);
    toggle.appendChild(info);
    toggle.addEventListener('click', () => {
      if (expandedIds.has(s.id)) expandedIds.delete(s.id); else expandedIds.add(s.id);
      renderSessions(lastSessions);
    });

    const killBtn = el('button', 'kill-btn', 'Kill');
    killBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // otherwise the tap also toggles the card open
      onKill(killBtn, s.id, displayName);
    });

    row.appendChild(toggle);
    row.appendChild(killBtn);
    card.appendChild(row);

    if (expandedIds.has(s.id)) {
      const expandRow = el('div', 'expand-row');
      const stopBtn = el('button', 'stop-btn', 'Stop');
      stopBtn.type = 'button';
      stopBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        onStop(stopBtn, s.id, displayName);
      });
      expandRow.appendChild(stopBtn);
      card.appendChild(expandRow);
    }

    sessionsEl.appendChild(card);
  }
}

async function onKill(btn, id, name) {
  if (!confirm(`Delete session "${name}"?`)) return;
  btn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/sessions/${id}`, { method: 'DELETE' });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'failed to delete');
    expandedIds.delete(id);
    toast(`Deleted ${name}`);
    refreshSessions();
  } catch (err) {
    toast(err.message);
    btn.disabled = false;
  }
}

// No confirm() here, unlike onKill: stopping is reversible via
// `claude attach <id>`, so the friction should be lower than a permanent
// delete. The session drops out of the list afterward (listSessions omits
// --all — see sessions.go), so the toast carries the resume command.
async function onStop(btn, id, name) {
  btn.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/api/sessions/${id}/stop`, { method: 'POST' });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'failed to stop');
    expandedIds.delete(id);
    toast(`Stopped ${name} — resume with claude attach ${id}`);
    refreshSessions();
  } catch (err) {
    toast(err.message);
    btn.disabled = false;
  }
}

async function loadFolders() {
  try {
    const res = await fetch(`${API_BASE}/api/folders`);
    if (!res.ok) return;
    const groups = await res.json();
    allEntries = flattenGroups(groups);
    renderFavoritesRow();
  } catch (e) {
    // folder picker is a convenience; failing silently is fine, free-text still works
  }
}

cwdInput.addEventListener('input', () => {
  if (!nameInput.value && cwdInput.value) {
    nameInput.value = basename(cwdInput.value);
  }
  renderDropdown(cwdInput.value.trim());
});

let blurTimer = null;

cwdInput.addEventListener('focus', () => {
  // Cancel a pending close from a just-prior blur — otherwise a rapid
  // blur-then-refocus (e.g. a mis-tap) leaves a stale timer that tears
  // the dropdown down ~150ms later even though the user is now actively
  // focused on and interacting with the field again.
  if (blurTimer) {
    clearTimeout(blurTimer);
    blurTimer = null;
  }
  openDropdown();
});

cwdInput.addEventListener('blur', () => {
  // Row/star taps call preventDefault() in their own mousedown/touchstart
  // handler, which cancels the browser's focus-loss action for THAT
  // interaction, so blur never fires for a direct row/star tap at all —
  // no race to win there. This delay exists for the OTHER ways #cwd can
  // blur (tapping elsewhere on the page, Tab-based focus change), so a
  // stray blur doesn't tear the dropdown down before a same-tick related
  // interaction finishes. The `focus` listener above cancels this timer
  // if the user refocuses before it fires.
  blurTimer = setTimeout(() => {
    closeDropdown();
    blurTimer = null;
  }, 150);
});

spawnBtn.addEventListener('click', async () => {
  const cwd = cwdInput.value.trim();
  const name = nameInput.value.trim() || basename(cwd);
  if (!cwd) { toast('Pick or type a folder first'); return; }
  spawnBtn.disabled = true;
  spawnBtn.textContent = 'Spawning…';
  try {
    // Model/effort/permission-mode/prompt are only included when set, so a
    // blank field is genuinely absent from the request body -- the server
    // (sessions.go SpawnOptions) omits the matching claude flag entirely and
    // ~/.claude/settings.json decides, exactly as if this UI didn't exist.
    // worktree is the one deliberate default-on exception, so it's always
    // sent explicitly.
    const payload = { cwd, name, worktree: worktreeInput.checked };
    if (modelInput.value) payload.model = modelInput.value;
    if (effortInput.value) payload.effort = effortInput.value;
    if (permissionModeInput.value) payload.permissionMode = permissionModeInput.value;
    if (promptInput.value.trim()) payload.prompt = promptInput.value.trim();

    const res = await fetch(`${API_BASE}/api/sessions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'failed to spawn');

    if (body.worktree) {
      toast(`Launching "${name}" in worktree ${body.worktree}…`);
    } else if (body.worktreeSkipped) {
      toast(`Launching "${name}" — no worktree (${body.worktreeSkipped})`);
    } else {
      toast(`Launching "${name}"…`);
    }

    cwdInput.value = '';
    nameInput.value = '';
    resetSpawnOptions();
    favoritesRowEl.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
    setTimeout(refreshSessions, 1500);
  } catch (err) {
    toast(err.message);
  } finally {
    spawnBtn.disabled = false;
    spawnBtn.textContent = 'Spawn Session';
  }
});

favorites = loadFavorites();
loadFolders();
refreshSessions();
setInterval(refreshSessions, 4000);
</script>
</body>
</html>
